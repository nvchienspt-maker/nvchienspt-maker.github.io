name: Generate Files and Icons JSON

on:
  release:
    types: [published, edited, deleted]
  push:
    branches:
      - main
    paths:
      - 'icons/**'              # Chạy khi có icon mới được upload/thay đổi
  workflow_dispatch:          # Cho phép bấm nút chạy thủ công bất kỳ lúc nào

jobs:
  build-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Generate data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import re
          import json
          import requests

          token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPO_NAME")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github.v3+json"
          }

          # Tải bảng ánh xạ tên hiển thị từ file app_name.txt online
          APP_NAMES = {}
          APP_NAMES_URL = "https://raw.githubusercontent.com/nvchienspt-maker/nvchienspt-maker.github.io/refs/heads/main/files/app_name.txt"
          try:
              res_names = requests.get(APP_NAMES_URL, timeout=15)
              if res_names.status_code == 200:
                  content = res_names.text.strip()
                  # Thử parse JSON hoặc Python dictionary
                  try:
                      parsed = json.loads(content)
                  except Exception:
                      try:
                          import ast
                          parsed = ast.literal_eval(content)
                      except Exception:
                          # Đọc theo từng dòng nếu là dạng text thuần (key: value, key = value hoặc key|value)
                          parsed = {}
                          for line in content.splitlines():
                              line = line.strip()
                              if not line or line.startswith("#"):
                                  continue
                              for sep in [":", "=", "|"]:
                                  if sep in line:
                                      k, v = line.split(sep, 1)
                                      parsed[k.strip().strip('"\'').lower()] = v.strip().strip('"\',')
                                      break
                  if isinstance(parsed, dict):
                      APP_NAMES = {str(k).strip().lower(): str(v).strip() for k, v in parsed.items()}
          except Exception as e:
              print(f"Cảnh báo: Không thể tải app_name.txt ({e})")

          def get_app_display_name(file_name):
              stem = os.path.splitext(file_name)[0]
              # Lấy đoạn đầu của tên app trước dấu '_' (ví dụ: chophim_v1.1.0.apk -> chophim)
              app_key = stem.split('_')[0].strip().lower()
              if app_key in APP_NAMES:
                  return APP_NAMES[app_key]
              for key in sorted(APP_NAMES.keys(), key=len, reverse=True):
                  if stem.lower().startswith(key):
                      return APP_NAMES[key]
              return stem.split('_')[0].strip()

          def get_app_group(file_name):
              stem = os.path.splitext(file_name)[0].lower()
              if any(k in stem for k in ["movie", "phim", "cinema", "rap", "hbomax", "netflix", "quantv", "tv360", "getout"]):
                  return "Xem Phim"
              if any(k in stem for k in ["tivi", "vtv", "mytv", "fpt", "vietmi", "vietplay", "vapp"]):
                  return "Truyền Hình"
              if any(k in stem for k in ["ytb", "youtube", "smarttube", "tiktok"]):
                  return "Giải Trí"
              if any(k in stem for k in ["voice", "kiki", "map"]):
                  return "Tiện Ích Voice"
              if any(k in stem for k in ["ezviz", "yoosee", "imou", "adb", "coccoc", "tvbro"]):
                  return "Công Cụ System"
              return "Ứng Dụng TV"

          def get_app_version(file_name):
              match = re.search(r'[_-]v?(\d+(?:\.\d+)+)', file_name, re.IGNORECASE)
              if match:
                  return match.group(1)
              return ""

          # 1. Lấy toàn bộ assets từ tất cả Releases
          releases_url = f"https://api.github.com/repos/{repo}/releases"
          res = requests.get(releases_url, headers=headers)
          releases_data = res.json() if res.status_code == 200 else []

          files_list = []
          for rel in releases_data:
              tag_name = rel.get("tag_name")
              release_name = rel.get("name") or tag_name
              published_at = rel.get("published_at")
              
              for asset in rel.get("assets", []):
                  file_name = asset.get("name") or ""
                  app_name = get_app_display_name(file_name)
                  app_group = get_app_group(file_name)
                  app_version = get_app_version(file_name)
                  
                  files_list.append({
                      "name": app_name,
                      "version": app_version,
                      "group": app_group,
                      "release_tag": tag_name,
                      "release_title": release_name,
                      "file_name": file_name,
                      "size_bytes": asset.get("size"),
                      "download_count": asset.get("download_count"),
                      "download_url": asset.get("browser_download_url"),
                      "created_at": asset.get("created_at"),
                      "published_at": published_at
                  })

          # 2. Quét link các file icon trong thư mục 'icons'
          icons_dict = {}
          icon_dir = "icons"
          valid_exts = (".png", ".jpg", ".jpeg", ".svg", ".webp", ".ico")

          if os.path.exists(icon_dir):
              for root, _, files in os.walk(icon_dir):
                  for f in sorted(files):
                      if f.lower().endswith(valid_exts):
                          rel_path = os.path.relpath(os.path.join(root, f), ".")
                          raw_url = f"https://raw.githubusercontent.com/{repo}/main/{rel_path}"
                          icons_dict[f] = raw_url

          # 3. Ghi dữ liệu ra file data.json
          output = {
              "repository": repo,
              "total_files": len(files_list),
              "total_icons": len(icons_dict),
              "icons": icons_dict,
              "files": files_list
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Done! Exported {len(files_list)} files and {len(icons_dict)} icons.")
          EOF

      - name: Commit and Push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json" && git push)
