name: Generate Apps and Icons JSON

on:
  release:
    types: [published, edited, deleted]
  push:
    branches:
      - main
    paths:
      - 'icons/**'               # Chạy khi có icon mới được upload/thay đổi
      - 'apps/**'               # Chạy khi có app mới được upload trực tiếp
  workflow_dispatch:             # Cho phép bấm nút chạy thủ công bất kỳ lúc nào

jobs:
  build-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Generate data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os
          import re
          import json
          import requests

          token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPO_NAME")
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github.v3+json"
          }

          # Domain GitHub Pages thay vì dùng raw.githubusercontent.com
          BASE_PAGES_URL = "https://nvchienspt-maker.github.io"

          # Tải bảng ánh xạ tên hiển thị từ  app_name.txt (đọc local trước, nếu không có mới tải qua Pages)
          APP_NAMES = {}
          local_app_name_path = os.path.join("s", "app_name.txt")
          content = ""

          if os.path.exists(local_app_name_path):
              try:
                  with open(local_app_name_path, "r", encoding="utf-8") as f:
                      content = f.read().strip()
              except Exception as e:
                  print(f"Không thể đọc  local app_name.txt ({e})")

          if not content:
              APP_NAMES_URL = f"{BASE_PAGES_URL}/s/app_name.txt"
              try:
                  res_names = requests.get(APP_NAMES_URL, timeout=15)
                  if res_names.status_code == 200:
                      content = res_names.text.strip()
              except Exception as e:
                  print(f"Cảnh báo: Không thể tải app_name.txt ({e})")

          if content:
              try:
                  parsed = json.loads(content)
              except Exception:
                  try:
                      import ast
                      parsed = ast.literal_eval(content)
                  except Exception:
                      # Đọc theo từng dòng nếu là dạng text thuần (key: value, key = value hoặc key|value)
                      parsed = {}
                      for line in content.splitlines():
                          line = line.strip()
                          if not line or line.startswith("#"):
                              continue
                          for sep in [":", "=", "|"]:
                              if sep in line:
                                  k, v = line.split(sep, 1)
                                  parsed[k.strip().strip('"\'').lower()] = v.strip().strip('"\',')
                                  break
              if isinstance(parsed, dict):
                  APP_NAMES = {str(k).strip().lower(): str(v).strip() for k, v in parsed.items()}

          def get_app_display_name(_name):
              stem = os.path.splitext(_name)[0]
              # Lấy đoạn đầu của tên app trước dấu '_' (ví dụ: chophim_v1.1.0.apk -> chophim)
              app_key = stem.split('_')[0].strip().lower()
              if app_key in APP_NAMES:
                  return APP_NAMES[app_key]
              for key in sorted(APP_NAMES.keys(), key=len, reverse=True):
                  if stem.lower().startswith(key):
                      return APP_NAMES[key]
              return stem.split('_')[0].strip()

          def get_app_group(_name):
              stem = os.path.splitext(_name)[0].lower()
              if any(k in stem for k in ["movie", "phim", "cinema", "rap", "hbomax", "netflix"]):
                  return "Xem Phim"
              if any(k in stem for k in ["tivi", "vtv", "mytv", "fpt", "vietmi", "vietplay", "vapp", "quantv", "tv360", "getout"]):
                  return "Truyền Hình"
              if any(k in stem for k in ["cobalt", "ytb", "youtube", "smarttube", "tiktok"]):
                  return "Giải Trí"
              if any(k in stem for k in ["voice", "kiki", "map"]):
                  return "Tiện Ích Voice"
              if any(k in stem for k in ["ezviz", "yoosee", "imou", "adb", "coccoc", "tvbro"]):
                  return "Công Cụ"
              if any(k in stem for k in ["store", "nvcstore", "mstore", "vxmstore"]):
                  return "Apps Store"
              return "Khác"

          def get_app_version(_name):
              match = re.search(r'[_-]v?(\d+(?:\.\d+)+)', _name, re.IGNORECASE)
              if match:
                  return match.group(1)
              return ""

          raw_s = []

          # 1. Lấy toàn bộ assets từ tất cả Releases
          releases_url = f"https://api.github.com/repos/{repo}/releases"
          res = requests.get(releases_url, headers=headers)
          releases_data = res.json() if res.status_code == 200 else []

          for rel in releases_data:
              tag_name = rel.get("tag_name")
              release_name = rel.get("name") or tag_name
              published_at = rel.get("published_at")
              
              for asset in rel.get("assets", []):
                  _name = asset.get("name") or ""
                  raw_s.append({
                      "source": "release",
                      "_name": _name,
                      "size_bytes": asset.get("size"),
                      "download_count": asset.get("download_count"),
                      "download_url": asset.get("browser_download_url"),
                      "release_tag": tag_name,
                      "release_title": release_name,
                      "created_at": asset.get("created_at"),
                      "published_at": published_at
                  })

          # 1.1. Quét các file upload trực tiếp vào GitHub (thư mục 'files' hoặc file cài đặt ở thư mục gốc)
          valid_app_exts = (".apk", ".xapk", ".apks", ".zip", ".rar", ".7z", ".ipa", ".wgt", ".exe")
          direct_dir = "files"
          if os.path.exists(direct_dir):
              for root, _, files in os.walk(direct_dir):
                  for f in sorted(files):
                      if f.lower() in ["app_name.txt", ".gitkeep"] or f.lower().endswith((".txt", ".md")):
                          continue
                      full_path = os.path.join(root, f)
                      rel_path = os.path.relpath(full_path, ".").replace(os.sep, "/")
                      raw_files.append({
                          "source": "direct",
                          "file_name": f,
                          "size_bytes": os.path.getsize(full_path),
                          "download_count": 0,
                          "download_url": f"{BASE_PAGES_URL}/{rel_path}",
                          "release_tag": None,
                          "release_title": "Direct GitHub Upload",
                          "created_at": None,
                          "published_at": None
                      })

          # Quét thêm file cài đặt ở thư mục gốc (nếu có)
          for f in sorted(os.listdir(".")):
              if os.path.isfile(f) and f.lower().endswith(valid_app_exts):
                  raw_files.append({
                      "source": "direct",
                      "file_name": f,
                      "size_bytes": os.path.getsize(f),
                      "download_count": 0,
                      "download_url": f"{BASE_PAGES_URL}/{f}",
                      "release_tag": None,
                      "release_title": "Direct GitHub Upload",
                      "created_at": None,
                      "published_at": None
                  })

          # 2. Gom nhóm các file cùng ứng dụng lại với nhau
          apps_map = {}
          for item in raw_files:
              file_name = item["file_name"]
              app_name = get_app_display_name(file_name)
              app_group = get_app_group(file_name)
              app_version = get_app_version(file_name)

              if app_name not in apps_map:
                  apps_map[app_name] = {
                      "name": app_name,
                      "version": app_version,
                      "group": app_group,
                      "downloads": []
                  }

              # Cập nhật version nếu ban đầu chưa nhận diện được
              if app_version and not apps_map[app_name]["version"]:
                  apps_map[app_name]["version"] = app_version

              apps_map[app_name]["downloads"].append({
                  "source": item["source"],
                  "file_name": file_name,
                  "version": app_version,
                  "size_bytes": item["size_bytes"],
                  "download_url": item["download_url"],
                  "release_tag": item["release_tag"],
                  "release_title": item["release_title"],
                  "download_count": item["download_count"],
                  "created_at": item["created_at"],
                  "published_at": item["published_at"]
              })

          apps_list = list(apps_map.values())

          # 3. Quét link các file icon trong thư mục 'icons'
          icons_dict = {}
          icon_dir = "icons"
          valid_exts = (".png", ".jpg", ".jpeg", ".svg", ".webp", ".ico")

          if os.path.exists(icon_dir):
              for root, _, files in os.walk(icon_dir):
                  for f in sorted(files):
                      if f.lower().endswith(valid_exts):
                          rel_path = os.path.relpath(os.path.join(root, f), ".").replace(os.sep, "/")
                          page_icon_url = f"{BASE_PAGES_URL}/{rel_path}"
                          icons_dict[f] = page_icon_url

          # 4. Ghi dữ liệu ra file data.json
          output = {
              "repository": repo,
              "total_apps": len(apps_list),
              "total_files": len(raw_files),
              "total_icons": len(icons_dict),
              "icons": icons_dict,
              "apps": apps_list,
              "files": apps_list
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(f"Done! Exported {len(apps_list)} apps ({len(raw_files)} files) and {len(icons_dict)} icons.")
          EOF

      - name: Commit and Push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json" && git push)
